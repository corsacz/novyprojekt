kortix_version: 2
default_agent: builder
project:
  name: novyprojekt
  description: Research workspace. The researcher agent investigates live web
    sources and lands cited briefs in memory/briefs/.
tools:
  web_search: kortix:web_search
  image_search: kortix:image_search
  scrape_webpage: kortix:scrape_webpage
  memory: kortix:memory
  show: kortix:show
agents:
  researcher:
    file: agents/researcher.md
    skills: all
    connectors: all
    secrets: none
    apps: none
    kortix_permissions:
      - project.read
      - project.write
      - project.gitops.read
      - project.gitops.push
      - project.review.read
  kortix:
    skills: all
    connectors: all
    secrets: all
    apps: all
    kortix_permissions: all
  builder:
    file: agents/builder.md
    enabled: true
    connectors: all
    apps: all
    skills: all
    tools: all
    kortix_permissions:
      - project.read
      - project.write
      - project.file.read
      - project.file.write
      - project.gitops.read
      - project.gitops.push
      - project.app.read
      - project.app.write
      - project.app.deploy
      - project.app.admin
      - project.connector.read
      - project.connector.write
